name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GenesisGraphicsStudio app.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/GenesisGraphicsStudio.exe")) { throw "Missing exe" }
          Get-Item dist/GenesisGraphicsStudio.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: GenesisGraphicsStudio-Windows-EXE
          path: dist/GenesisGraphicsStudio.exe
          if-no-files-found: error
          retention-days: 30
